const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(){
  const pw=document.getElementById('pw').value, msg=document.getElementById('msg'),
        btn=document.getElementById('go');
  if(!pw){msg.textContent='Enter the passphrase.';return;}
  btn.disabled=true; msg.style.color='#4b5a6b'; msg.textContent='Decrypting…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(E.salt),iterations:250000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
    const d=JSON.parse(new TextDecoder().decode(pt));
    document.getElementById('gate').remove();
    const st=document.createElement('style'); st.textContent=d.css; document.head.appendChild(st);
    document.getElementById('app').innerHTML=d.html;
    new Function(d.js)();
  }catch(err){
    btn.disabled=false; msg.style.color='#a83531';
    msg.textContent='Wrong passphrase — nothing was decrypted.';
  }
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script>
